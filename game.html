<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>게임 게시판 | 나의 기록보관소</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">‹</a>
    <h1>게임 게시판</h1>
  </div>

  <div id="list" class="list"></div>
  <div id="empty" class="empty" style="display:none">
    <div class="big">🎮</div>
    아직 글이 없어요.<br>오른쪽 아래 + 버튼으로 첫 글을 남겨보세요.
  </div>
</div>

<a class="fab" href="game_write.html">＋</a>

<script src="js/app.js"></script>
<script>
async function load(){
  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  try{
    const posts = await fetchJSON("api/board_list.php");
    if(posts.length === 0){ empty.style.display="block"; return; }
    list.innerHTML = posts.slice().reverse().map(p => {
      const link = p.link
        ? `<a href="${escapeHtml(p.link)}" target="_blank" rel="noopener" style="display:block;margin-top:10px;font-size:13px;">🔗 ${escapeHtml(p.link)}</a>`
        : "";
      return `<div class="row stack">
                <div class="top">
                  <div class="ricon">🎮</div>
                  <div class="rtxt">
                    <div class="t">${escapeHtml(p.title)}</div>
                    <div class="s">${escapeHtml(p.date || "")}</div>
                  </div>
                </div>
                <div class="post-html">${p.content}</div>
                ${link}
              </div>`;
    }).join("");
  }catch(e){
    empty.style.display="block";
    empty.innerHTML = `<div class="big">⚠️</div>글 목록을 불러오지 못했어요.<br><span style="font-size:12px">(api/board_list.php가 PHP로 실행되는 서버가 필요해요)</span>`;
  }
}
load();
</script>
</body>
</html>
