<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>음악 | 나의 기록보관소</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="pc-glass">
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">‹</a>
    <h1>음악</h1>
  </div>

  <div id="list" class="list"></div>
  <div id="empty" class="empty" style="display:none">
    <div class="big">🎵</div>
    MUSIC 폴더에 음악을 올리면<br>여기에 자동으로 나타나요.
  </div>
</div>

<!-- PC 화면 전용: 하단 고정 재생바(Now Playing). 모바일에서는 숨겨지고
     각 행의 기본 오디오 컨트롤로 재생합니다. -->
<div class="player-bar" id="playerBar">
  <div class="pb-icon">🎵</div>
  <div class="pb-info">
    <div class="pb-title" id="pbTitle">재생할 곡을 선택하세요</div>
    <div class="pb-sub" id="pbSub">—</div>
  </div>
  <audio id="pbAudio" controls preload="none"></audio>
</div>

<script src="js/app.js"></script>
<script>
// 브라우저가 바로 재생 가능한 형식
const PLAYABLE_EXT = ["mp3","wav","ogg","m4a","aac","flac"];
// 미디(.mid) 등은 브라우저가 직접 재생하지 못해 다운로드 링크로 제공
const OTHER_AUDIO_EXT = ["mid","midi","wma"];

const pbAudio = document.getElementById("pbAudio");
const pbTitle = document.getElementById("pbTitle");
const pbSub   = document.getElementById("pbSub");
const isDesktop = () => window.matchMedia("(min-width:768px)").matches;

// PC 화면(하단 재생바)에서만 동작: 모바일에서는 각 행의 기본 audio를 그대로 사용
function playInBar(file, src, ext, rowEl){
  if (!isDesktop()) return;
  pbAudio.src = src;
  pbTitle.textContent = file;
  pbSub.textContent = ext.toUpperCase();
  pbAudio.play().catch(() => {});
  document.querySelectorAll(".row.stack").forEach(r => r.classList.remove("active"));
  if (rowEl) rowEl.classList.add("active");
}

async function load(){
  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  try{
    const files = await fetchJSON("api/list_files.php?dir=MUSIC");
    const tracks = files.filter(f => PLAYABLE_EXT.includes(extOf(f)) || OTHER_AUDIO_EXT.includes(extOf(f)));
    if(tracks.length === 0){ empty.style.display="block"; return; }
    list.innerHTML = tracks.map(f => {
      const src = "MUSIC/" + encodeURIComponent(f);
      const ext = extOf(f);
      if(PLAYABLE_EXT.includes(ext)){
        return `<div class="row stack" data-file="${escapeHtml(f)}" data-src="${escapeHtml(src)}" data-ext="${ext}">
                  <div class="top">
                    <div class="ricon">🎵</div>
                    <div class="rtxt"><div class="t">${escapeHtml(f)}</div><div class="s">${ext.toUpperCase()}</div></div>
                  </div>
                  <audio controls preload="none" src="${src}"></audio>
                </div>`;
      }
      return `<a href="${src}" download style="text-decoration:none;color:inherit;">
                <div class="row">
                  <div class="ricon">🎼</div>
                  <div class="rtxt"><div class="t">${escapeHtml(f)}</div><div class="s">${ext.toUpperCase()} · 다운로드해서 재생</div></div>
                </div>
              </a>`;
    }).join("");

    // PC: 행의 아이콘/제목 영역을 누르면 하단 재생바에서 재생
    Array.from(list.querySelectorAll(".row.stack")).forEach(row => {
      row.querySelector(".top").addEventListener("click", () => {
        playInBar(row.dataset.file, row.dataset.src, row.dataset.ext, row);
      });
    });
  }catch(e){
    empty.style.display="block";
    empty.innerHTML = `<div class="big">⚠️</div>목록을 불러오지 못했어요.<br><span style="font-size:12px">(api/list_files.php가 PHP로 실행되는 서버가 필요해요)</span>`;
  }
}
load();
</script>
</body>
</html>
