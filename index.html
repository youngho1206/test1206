<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>나의 기록보관소</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preload" as="image" href="assets/icons/photo.jpg">
<link rel="preload" as="image" href="assets/icons/video.jpg">
<link rel="preload" as="image" href="assets/icons/music.jpg">
<link rel="preload" as="image" href="assets/icons/memo.jpg">
<link rel="preload" as="image" href="assets/icons/game.jpg">
</head>
<body class="home">
<div class="sky-layer" aria-hidden="true"></div>
<div class="wrap">
<div class="home-center">

  <div class="hero">
    <p class="kicker">MY LIST</p>
    <h1>최영호의 기록함 (DEMO)</h1>
    <p>저의 기록을 위해 만든 페이지입니다</p>
  </div>

  <div class="home-search">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" id="gameSearch" placeholder="게임 기종 검색 (예: NES, PSX, DOS, 패미컴...)" autocomplete="off" aria-label="게임 기종 검색">
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="menu">

    <a href="photo.html">
      <div class="tile">
        <img class="tile-img" decoding="async" fetchpriority="high" width="480" height="480" src="assets/icons/photo.jpg" alt="사진">
        <div class="tile-label"><span>사진</span></div>
      </div>
    </a>

    <a href="video.html">
      <div class="tile">
        <img class="tile-img" decoding="async" fetchpriority="high" width="480" height="480" src="assets/icons/video.jpg" alt="영상">
        <div class="tile-label"><span>영상</span></div>
      </div>
    </a>

    <a href="music.html">
      <div class="tile">
        <img class="tile-img" decoding="async" fetchpriority="high" width="480" height="480" src="assets/icons/music.jpg" alt="음악">
        <div class="tile-label"><span>음악</span></div>
      </div>
    </a>

    <a href="memo.html">
      <div class="tile">
        <img class="tile-img" decoding="async" fetchpriority="high" width="480" height="480" src="assets/icons/memo.jpg" alt="메모">
        <div class="tile-label"><span>메모</span></div>
      </div>
    </a>

    <a href="game/index.html">
      <div class="tile wide">
        <img class="tile-img" decoding="async" fetchpriority="high" width="480" height="480" src="assets/icons/game.jpg" alt="게임">
        <div class="tile-label">
          <span>게임</span>
        </div>
      </div>
    </a>

  </div>

</div>
</div>
<script src="js/app.js"></script>
<script>
// 게임/index.html 에서 지원하는 게임 기종 목록 (검색용 데이터)
const GAME_SYSTEMS=[
  {n:"NES",s:"패미컴",ext:".nes, .fds, .zip"},
  {n:"SNES",s:"슈퍼패미컴",ext:".smc, .sfc, .zip"},
  {n:"Game Boy",s:"GB / GBC",ext:".gb, .gbc, .zip"},
  {n:"Game Boy Advance",s:"GBA",ext:".gba, .zip"},
  {n:"Virtual Boy",s:"닌텐도 VB",ext:".vb, .vboy, .bin, .zip"},
  {n:"Mega Drive",s:"Genesis / 메가드라이브",ext:".md, .bin, .smd, .zip"},
  {n:"SEGA 32X",s:"메가드라이브 32X",ext:".32x, .bin, .smd, .md, .zip"},
  {n:"닌텐도DS",s:"Nintendo DS",ext:".nds, .zip"},
  {n:"MSX",s:"Microsoft MSX",ext:".rom, .mx1, .dsk, .cas, .zip (BIOS 파일 추가 선택 필요)"},
  {n:"MSX2",s:"Microsoft MSX2",ext:".rom, .mx2, .mx1, .dsk, .cas, .zip (BIOS 파일 추가 선택 필요)"},
  {n:"Atari 2600",s:"VCS",ext:".a26, .bin, .zip"},
  {n:"Atari 7800",s:"ProSystem",ext:".a78, .bin, .zip"},
  {n:"MS-DOS",s:"DOS 게임",ext:".zip, .jsdos, .img, .ima, .iso, .bin"},
  {n:"Windows 3.1",s:"PC / 16-bit",ext:".img, .ima, .iso, .bin"},
  {n:"Windows 95",s:"PC / 32-bit",ext:".img, .ima, .iso, .bin"}
];
(function(){
  const input=document.getElementById("gameSearch");
  const results=document.getElementById("searchResults");
  function render(q){
    results.innerHTML="";
    if(!q){ return; }
    const hit=GAME_SYSTEMS.filter(function(x){
      return x.n.toLowerCase().includes(q) || x.s.toLowerCase().includes(q);
    });
    if(hit.length===0){
      results.innerHTML='<div class="sr-empty">일치하는 게임 기종을 찾지 못했습니다. 기종 이름을 다시 확인해 주세요.</div>';
      return;
    }
    results.innerHTML=hit.map(function(x){
      return '<a class="sr-item" href="game/index.html">'
        +'<div class="sr-name">'+x.n+' <span class="sr-badge">지원됨</span></div>'
        +'<div class="sr-sub">'+x.s+'</div>'
        +'<div class="sr-ext">지원 확장자 · '+x.ext+'</div>'
        +'</a>';
    }).join("");
  }
  input.addEventListener("input",function(){ render(this.value.trim().toLowerCase()); });
})();
</script>
</body>
</html>
