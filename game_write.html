<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>글쓰기 | 게임 게시판</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="game.html">‹</a>
    <h1>글쓰기</h1>
  </div>

  <form id="writeForm" action="api/board_write.php" method="post" enctype="multipart/form-data">
    <div class="field">
      <label>제목</label>
      <input type="text" name="title" required maxlength="80" placeholder="제목을 입력하세요">
    </div>

    <div class="field">
      <label>내용</label>
      <div class="hint" style="margin:0 0 8px;">네이버 카페·블로그 글을 복사한 뒤 아래 편집창에 그대로 붙여넣기(Ctrl+V) 하면 서식과 사진이 함께 들어와요.</div>

      <div class="editor-wrap">
        <div class="editor-toolbar" id="toolbar">
          <select data-cmd="fontSize" title="글자 크기">
            <option value="">크기</option>
            <option value="2">작게</option>
            <option value="3" selected>보통</option>
            <option value="5">크게</option>
            <option value="7">아주 크게</option>
          </select>
          <span class="tsep"></span>
          <button type="button" data-cmd="bold"><b>B</b></button>
          <button type="button" data-cmd="italic"><i>I</i></button>
          <button type="button" data-cmd="underline"><u>U</u></button>
          <button type="button" data-cmd="strikeThrough"><s>S</s></button>
          <span class="tsep"></span>
          <button type="button" data-cmd="justifyLeft">≡</button>
          <button type="button" data-cmd="justifyCenter">☰</button>
          <button type="button" data-cmd="justifyRight">≣</button>
          <span class="tsep"></span>
          <button type="button" data-cmd="insertUnorderedList">•—</button>
          <button type="button" data-cmd="insertOrderedList">1.—</button>
          <button type="button" data-cmd="formatBlock" data-val="blockquote">❝</button>
          <span class="tsep"></span>
          <button type="button" id="imgBtn">🖼</button>
          <button type="button" id="linkBtn">🔗</button>
          <button type="button" data-cmd="insertHorizontalRule">―</button>
          <button type="button" data-cmd="removeFormat">Tx</button>
        </div>
        <div id="editor" class="editor-area" contenteditable="true" data-placeholder="여기에 직접 쓰거나, 네이버 글을 복사해서 붙여넣으세요"></div>
      </div>

      <input type="hidden" name="content" id="contentInput">
      <input type="file" id="imgFileInput" accept="image/*" style="display:none">
    </div>

    <div class="field">
      <label>링크 (선택)</label>
      <input type="url" name="link" placeholder="https://...">
    </div>

    <button class="btn" type="submit">게시하기</button>
  </form>
</div>

<script src="js/app.js"></script>
<script>
const editor = document.getElementById("editor");

document.execCommand("styleWithCSS", false, true);

document.getElementById("toolbar").addEventListener("click", function(e){
  const btn = e.target.closest("button[data-cmd]");
  if(!btn) return;
  editor.focus();
  document.execCommand(btn.dataset.cmd, false, btn.dataset.val || null);
});
document.getElementById("toolbar").addEventListener("change", function(e){
  const sel = e.target.closest("select[data-cmd]");
  if(!sel || !sel.value) return;
  editor.focus();
  document.execCommand(sel.dataset.cmd, false, sel.value);
});

document.getElementById("linkBtn").addEventListener("click", function(){
  const url = prompt("연결할 주소를 입력하세요 (https://...)");
  if(url){ editor.focus(); document.execCommand("createLink", false, url); }
});

document.getElementById("imgBtn").addEventListener("click", function(){
  document.getElementById("imgFileInput").click();
});
document.getElementById("imgFileInput").addEventListener("change", function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    editor.focus();
    document.execCommand("insertHTML", false, '<img src="'+ev.target.result+'" style="max-width:100%;">');
  };
  reader.readAsDataURL(file);
  e.target.value = "";
});

document.getElementById("writeForm").addEventListener("submit", function(e){
  if(editor.innerHTML.trim() === ""){
    e.preventDefault();
    alert("내용을 입력해주세요.");
    return;
  }
  document.getElementById("contentInput").value = editor.innerHTML;
  const btn = e.target.querySelector(".btn");
  btn.disabled = true;
  btn.textContent = "게시하는 중... (사진이 많으면 시간이 걸려요)";
});
</script>
</body>
</html>
