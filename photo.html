<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>사진 | 나의 기록보관소</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="pc-glass">

<!-- 사진이 없을 때: 심플한 빈 상태 화면 -->
<a class="native-back" id="nativeBack" href="index.html" style="display:none">‹</a>
<button type="button" class="native-camera" id="nativeCamera" style="display:none" aria-label="카메라로 촬영">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1.2a2 2 0 0 0 1.73-1l.54-.94A2 2 0 0 1 11.2 3h1.6a2 2 0 0 1 1.73 1l.54.94a2 2 0 0 0 1.73 1H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/><circle cx="12" cy="13" r="3.5"/></svg>
</button>
<div class="native-empty" id="nativeEmpty" style="display:none">
  <div class="t1">사진이 없습니다</div>
  <div class="t2">PHOTO 폴더에 사진을 올리면<br>여기에 자동으로 나타나요.</div>
</div>

<!-- 사진이 있을 때: 일반 목록 화면 -->
<div class="wrap" id="mainWrap" style="display:none;padding-bottom:110px;">
  <div class="topbar">
    <a class="back" href="index.html">‹</a>
    <h1>사진</h1>
    <button type="button" class="camera-btn" id="btnCamera" aria-label="카메라로 촬영">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1.2a2 2 0 0 0 1.73-1l.54-.94A2 2 0 0 1 11.2 3h1.6a2 2 0 0 1 1.73 1l.54.94a2 2 0 0 0 1.73 1H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </button>
  </div>

  <div id="grid" class="pgrid"></div>
</div>

<!-- 카메라 촬영용 숨김 입력 (capture 속성으로 실제 카메라 앱 실행) -->
<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">

<!-- 하단 메뉴: 목록 상태 (선택 / 다운로드 / 삭제) -->
<div class="bottombar" id="listBar" style="display:none">
  <button id="btnSelect" type="button">선택</button>
  <button id="btnDownloadSel" type="button">다운로드</button>
  <button id="btnDeleteSel" type="button" class="danger">삭제</button>
</div>

<!-- 사진 크게 보기 -->
<div class="viewer" id="viewer">
  <div class="vclose" id="viewerClose">✕</div>
  <img id="viewerImg" src="" alt="">
</div>

<!-- 하단 메뉴: 사진 보기 상태 (다운로드 / 정보) -->
<div class="bottombar" id="viewBar" style="display:none">
  <button id="btnDownloadOne" type="button">다운로드</button>
  <button id="btnInfo" type="button">정보</button>
</div>

<!-- 정보 보기/입력/수정 모달 -->
<div class="modal-overlay" id="infoModal">
  <div class="modal-sheet">

    <div id="viewStep">
      <h2>사진 정보</h2>
      <div class="info-view" id="infoView">등록된 정보가 없습니다.</div>
      <div class="modal-actions">
        <button type="button" class="cancel" id="viewClose">닫기</button>
        <button type="button" class="ok" id="viewSettings">설정</button>
      </div>
    </div>

    <div id="pwStep" style="display:none">
      <h2>비밀번호 확인</h2>
      <input type="password" id="pwInput" inputmode="numeric" placeholder="비밀번호를 입력하세요" autocomplete="off">
      <div class="modal-msg" id="pwMsg"></div>
      <div class="modal-actions">
        <button type="button" class="cancel" id="pwCancel">취소</button>
        <button type="button" class="ok" id="pwOk">확인</button>
      </div>
    </div>

    <div id="infoStep" style="display:none">
      <h2>정보 수정</h2>
      <textarea id="infoText" placeholder="이 사진에 대한 정보를 입력하세요"></textarea>
      <div class="modal-msg" id="infoMsg"></div>
      <div class="modal-actions">
        <button type="button" class="cancel" id="infoCancel">취소</button>
        <button type="button" class="ok" id="infoSave">저장</button>
      </div>
    </div>

  </div>
</div>

<script src="js/app.js"></script>
<script>
const IMG_EXT = ["jpg","jpeg","png","gif","webp","bmp","heic"];

let photos = [];          // 현재 표시 중인 파일명 목록
let lastKey = "";         // 변경 감지용
let selecting = false;    // 선택 모드 여부
let picked = new Set();   // 선택된 파일명
let viewerFile = null;    // 현재 크게 보고 있는 파일명

const nativeBack  = document.getElementById("nativeBack");
const nativeCamera= document.getElementById("nativeCamera");
const nativeEmpty = document.getElementById("nativeEmpty");
const mainWrap    = document.getElementById("mainWrap");
const grid        = document.getElementById("grid");
const listBar     = document.getElementById("listBar");
const viewBar     = document.getElementById("viewBar");
const viewer      = document.getElementById("viewer");
const viewerImg   = document.getElementById("viewerImg");
const cameraInput = document.getElementById("cameraInput");

function srcOf(f){ return "PHOTO/" + encodeURIComponent(f); }

function renderEmpty(){
  document.body.className = "photo-empty pc-glass";
  nativeBack.style.display = "flex";
  nativeCamera.style.display = "flex";
  nativeEmpty.style.display = "flex";
  mainWrap.style.display = "none";
  listBar.style.display = "none";
  viewBar.style.display = "none";
}

function renderGrid(){
  document.body.className = "pc-glass";
  nativeBack.style.display = "none";
  nativeCamera.style.display = "none";
  nativeEmpty.style.display = "none";
  mainWrap.style.display = "block";

  grid.className = "pgrid" + (selecting ? " selecting" : "");
  grid.innerHTML = photos.map(f => {
    const isPicked = picked.has(f);
    return `<div class="ph${isPicked ? " picked" : ""}" data-file="${escapeHtml(f)}">
              <img src="${srcOf(f)}" loading="lazy" decoding="async" alt="${escapeHtml(f)}">
              <div class="dim"></div>
              <div class="check">${isPicked ? "✓" : ""}</div>
            </div>`;
  }).join("");

  Array.from(grid.querySelectorAll(".ph")).forEach(el => {
    el.addEventListener("click", () => {
      const f = el.getAttribute("data-file");
      if (selecting){
        if (picked.has(f)) picked.delete(f); else picked.add(f);
        renderGrid();
      } else {
        openViewer(f);
      }
    });
  });

  if (!viewer.classList.contains("open")){
    listBar.style.display = "flex";
    viewBar.style.display = "none";
  }
  document.getElementById("btnSelect").textContent = selecting ? "완료" : "선택";
  document.getElementById("btnSelect").classList.toggle("on", selecting);
}

function render(){
  if (photos.length === 0){
    renderEmpty();
  } else {
    renderGrid();
  }
}

async function poll(){
  try{
    const files = await fetchJSON("api/list_files.php?dir=PHOTO");
    const list = files.filter(f => IMG_EXT.includes(extOf(f)));
    const key = JSON.stringify(list);
    if (key !== lastKey){
      lastKey = key;
      photos = list;
      picked = new Set(Array.from(picked).filter(f => photos.includes(f)));
      if (!viewer.classList.contains("open") && !document.getElementById("infoModal").classList.contains("open")){
        render();
      }
    }
  }catch(e){
    if (lastKey === ""){
      nativeEmpty.innerHTML = `<div class="t1">⚠️ 목록을 불러오지 못했어요</div><div class="t2">api/list_files.php가 PHP로 실행되는 서버가 필요해요</div>`;
      renderEmpty();
    }
  }
}

/* ---- 카메라 촬영: 실제 카메라 앱 실행 → 촬영/확인 → 바로 업로드 ---- */
document.getElementById("btnCamera").addEventListener("click", () => cameraInput.click());
nativeCamera.addEventListener("click", () => cameraInput.click());

cameraInput.addEventListener("change", async () => {
  const fl = cameraInput.files;
  if (!fl || fl.length === 0) return;
  const fd = new FormData();
  Array.from(fl).forEach(f => fd.append("files[]", f));
  try{
    const res = await fetch("api/photo_upload.php", { method: "POST", body: fd });
    const data = await res.json();
    if (!res.ok || data.error){
      alert(data.error || "사진을 저장하지 못했어요.");
    } else {
      await poll();
    }
  }catch(e){
    alert("사진을 저장하지 못했어요. 서버 연결을 확인해주세요.");
  }
  cameraInput.value = "";
});

/* ---- 선택 / 다운로드 ---- */
document.getElementById("btnSelect").addEventListener("click", () => {
  selecting = !selecting;
  if (!selecting) picked.clear();
  renderGrid();
});

function downloadFile(f){
  const a = document.createElement("a");
  a.href = srcOf(f);
  a.download = f;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

document.getElementById("btnDownloadSel").addEventListener("click", () => {
  if (picked.size === 0){
    alert("먼저 '선택'을 눌러 다운로드할 사진을 골라주세요.");
    return;
  }
  Array.from(picked).forEach(f => downloadFile(f));
});

document.getElementById("btnDeleteSel").addEventListener("click", async () => {
  if (picked.size === 0){
    alert("먼저 '선택'을 눌러 삭제할 사진을 골라주세요.");
    return;
  }
  const list = Array.from(picked);
  if (!confirm(list.length + "장의 사진을 삭제할까요?")) return;

  const succeeded = [];
  for (const f of list){
    try{
      const body = new URLSearchParams();
      body.set("file", f);
      const res = await fetch("api/photo_delete.php", { method: "POST", body });
      const data = await res.json();
      if (res.ok && !data.error) succeeded.push(f);
    }catch(e){}
  }

  photos = photos.filter(f => !succeeded.includes(f));
  lastKey = JSON.stringify(photos);
  selecting = false;
  picked.clear();
  render();

  if (succeeded.length < list.length){
    alert(succeeded.length + "장 삭제, " + (list.length - succeeded.length) + "장은 삭제하지 못했어요.");
  }
});

/* ---- 사진 크게 보기 ---- */
function openViewer(f){
  viewerFile = f;
  viewerImg.src = srcOf(f);
  resetZoom();
  viewer.classList.add("open");
  listBar.style.display = "none";
  viewBar.style.display = "flex";
}
function closeViewer(){
  viewer.classList.remove("open");
  viewerFile = null;
  viewBar.style.display = "none";
  listBar.style.display = "flex";
  resetZoom();
}
document.getElementById("viewerClose").addEventListener("click", closeViewer);
viewer.addEventListener("click", (e) => { if (e.target === viewer) closeViewer(); });

/* ---- 사진만 확대/축소 (핀치 줌 + 드래그 이동), 페이지 전체 줌은 막음 ---- */
let zScale = 1, zX = 0, zY = 0;
let pinchStartDist = 0, pinchStartScale = 1;
let dragActive = false, dragStart = null, panStart = null;

function applyZoom(snap){
  viewerImg.classList.toggle("snapping", !!snap);
  viewerImg.style.transform = `translate(${zX}px, ${zY}px) scale(${zScale})`;
}
function resetZoom(){
  zScale = 1; zX = 0; zY = 0;
  applyZoom(false);
}
function touchDist(t0, t1){
  const dx = t0.clientX - t1.clientX;
  const dy = t0.clientY - t1.clientY;
  return Math.hypot(dx, dy);
}

viewerImg.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2){
    dragActive = false;
    pinchStartDist = touchDist(e.touches[0], e.touches[1]);
    pinchStartScale = zScale;
  } else if (e.touches.length === 1 && zScale > 1){
    dragActive = true;
    dragStart = { x:e.touches[0].clientX, y:e.touches[0].clientY };
    panStart = { x:zX, y:zY };
  }
}, { passive:false });

viewerImg.addEventListener("touchmove", (e) => {
  e.preventDefault();
  if (e.touches.length === 2 && pinchStartDist > 0){
    const d = touchDist(e.touches[0], e.touches[1]);
    zScale = Math.min(Math.max(pinchStartScale * (d / pinchStartDist), 1), 5);
    applyZoom(false);
  } else if (e.touches.length === 1 && dragActive){
    zX = panStart.x + (e.touches[0].clientX - dragStart.x);
    zY = panStart.y + (e.touches[0].clientY - dragStart.y);
    applyZoom(false);
  }
}, { passive:false });

viewerImg.addEventListener("touchend", (e) => {
  if (e.touches.length < 2) pinchStartDist = 0;
  if (e.touches.length === 0){
    dragActive = false;
    if (zScale <= 1){ resetZoom(); }
  }
});

viewerImg.addEventListener("dblclick", () => {
  if (zScale > 1){ resetZoom(); }
  else { zScale = 2.4; applyZoom(true); }
});

document.getElementById("btnDownloadOne").addEventListener("click", () => {
  if (viewerFile) downloadFile(viewerFile);
});

/* ---- 정보 보기 / 비밀번호 확인 후 수정 ---- */
const infoModal  = document.getElementById("infoModal");
const viewStep    = document.getElementById("viewStep");
const infoView    = document.getElementById("infoView");
const pwStep      = document.getElementById("pwStep");
const infoStep    = document.getElementById("infoStep");
const pwInput     = document.getElementById("pwInput");
const pwMsg       = document.getElementById("pwMsg");
const infoText    = document.getElementById("infoText");
const infoMsg     = document.getElementById("infoMsg");

let currentInfo = "";

function showStep(step){
  viewStep.style.display = (step === "view") ? "block" : "none";
  pwStep.style.display   = (step === "pw")   ? "block" : "none";
  infoStep.style.display = (step === "edit") ? "block" : "none";
}

async function openInfoModal(){
  infoModal.classList.add("open");
  showStep("view");
  infoView.textContent = "불러오는 중...";
  try{
    const data = await fetchJSON("api/photo_info.php?file=" + encodeURIComponent(viewerFile));
    currentInfo = data.info || "";
    infoView.textContent = currentInfo.trim() !== "" ? currentInfo : "등록된 정보가 없습니다.";
  }catch(e){
    currentInfo = "";
    infoView.textContent = "정보를 불러오지 못했어요.";
  }
}
function closeInfoModal(){
  infoModal.classList.remove("open");
}
document.getElementById("btnInfo").addEventListener("click", openInfoModal);
document.getElementById("viewClose").addEventListener("click", closeInfoModal);
infoModal.addEventListener("click", (e) => { if (e.target === infoModal) closeInfoModal(); });

document.getElementById("viewSettings").addEventListener("click", () => {
  pwInput.value = "";
  pwMsg.textContent = "";
  showStep("pw");
  setTimeout(() => pwInput.focus(), 50);
});
document.getElementById("pwCancel").addEventListener("click", () => showStep("view"));
document.getElementById("infoCancel").addEventListener("click", () => showStep("view"));

document.getElementById("pwOk").addEventListener("click", () => {
  if (pwInput.value !== "3553"){
    pwMsg.textContent = "비밀번호가 올바르지 않습니다.";
    return;
  }
  pwMsg.textContent = "";
  infoMsg.textContent = "";
  infoText.value = currentInfo;
  showStep("edit");
});

pwInput.addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("pwOk").click(); });

document.getElementById("infoSave").addEventListener("click", async () => {
  infoMsg.textContent = "저장 중...";
  try{
    const body = new URLSearchParams();
    body.set("file", viewerFile);
    body.set("password", "3553");
    body.set("info", infoText.value);
    const res = await fetch("api/photo_info.php", { method: "POST", body });
    if (!res.ok) throw new Error("save failed");
    currentInfo = infoText.value;
    infoView.textContent = currentInfo.trim() !== "" ? currentInfo : "등록된 정보가 없습니다.";
    infoMsg.textContent = "";
    showStep("view");
  }catch(e){
    infoMsg.textContent = "저장하지 못했어요. 서버 연결을 확인해주세요.";
  }
});

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
