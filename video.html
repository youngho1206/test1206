<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>영상 | 나의 기록보관소</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="pc-glass">
<div class="wrap" style="padding-bottom:100px;">
  <div class="topbar">
    <a class="back" href="index.html">‹</a>
    <h1>영상</h1>
    <button type="button" class="text-btn" id="btnSelectMode">삭제</button>
  </div>

  <div id="grid" class="vgrid"></div>
  <div id="empty" class="empty" style="display:none">
    <div class="big">🎬</div>
    유튜브 링크를 추가하면<br>여기에 썸네일로 나타나요.
  </div>
</div>

<div class="fab" id="addBtn">＋</div>

<!-- 하단 메뉴: 영상 선택 삭제 상태 -->
<div class="bottombar" id="selectBar" style="display:none">
  <button id="btnDeleteSel" type="button" class="danger">선택 삭제</button>
</div>

<!-- 삭제 비밀번호 확인 (터치 키패드) -->
<div class="modal-overlay" id="delPwModal">
  <div class="modal-sheet">
    <h2>비밀번호 확인</h2>
    <p class="pw-desc" id="delPwDesc"></p>
    <div class="pw-dots" id="delPwDots">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="modal-msg" id="delPwMsg"></div>
    <div class="keypad" id="delKeypad">
      <button type="button" data-k="1">1</button>
      <button type="button" data-k="2">2</button>
      <button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button>
      <button type="button" data-k="5">5</button>
      <button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button>
      <button type="button" data-k="8">8</button>
      <button type="button" data-k="9">9</button>
      <button type="button" class="keypad-empty" disabled></button>
      <button type="button" data-k="0">0</button>
      <button type="button" class="keypad-del" data-k="del">⌫</button>
    </div>
    <div class="modal-actions">
      <button type="button" class="cancel" id="delPwCancel">취소</button>
    </div>
  </div>
</div>

<!-- 유튜브 링크 추가: 비밀번호 확인 → 링크 입력 -->
<div class="modal-overlay" id="addModal">
  <div class="modal-sheet">

    <div id="addPwStep">
      <h2>비밀번호 확인</h2>
      <input type="password" id="addPwInput" inputmode="numeric" placeholder="비밀번호를 입력하세요" autocomplete="off">
      <div class="modal-msg" id="addPwMsg"></div>
      <div class="modal-actions">
        <button type="button" class="cancel" id="addPwCancel">취소</button>
        <button type="button" class="ok" id="addPwOk">확인</button>
      </div>
    </div>

    <div id="addLinkStep" style="display:none">
      <h2>유튜브 영상 추가</h2>
      <input type="url" id="ytLink" placeholder="유튜브 링크를 붙여넣으세요" autocomplete="off">
      <div class="modal-msg" id="addMsg"></div>
      <div class="modal-actions">
        <button type="button" class="cancel" id="addCancel">취소</button>
        <button type="button" class="ok" id="addOk">업로드</button>
      </div>
    </div>

  </div>
</div>

<!-- 유튜브 웹플레이어 -->
<div class="viewer" id="playerViewer">
  <div class="vclose" id="playerClose">✕</div>
  <div class="player-wrap" id="playerWrap">
    <div id="playerFrame"></div>
    <div class="fs-exit" id="fsExit">✕ 전체화면 종료</div>
  </div>
</div>

<!-- 하단 메뉴: 영상 재생 상태 -->
<div class="bottombar" id="playBar" style="display:none">
  <button id="btnFullscreen" type="button">전체화면</button>
  <button id="btnInfo" type="button">정보</button>
</div>

<!-- 정보 보기/입력/수정 모달 -->
<div class="modal-overlay" id="infoModal">
  <div class="modal-sheet">

    <div id="viewStep">
      <h2>영상 정보</h2>
      <div class="info-view" id="infoView">등록된 정보가 없습니다.</div>
      <div class="modal-actions">
        <button type="button" class="cancel" id="viewClose">닫기</button>
        <button type="button" class="ok" id="viewSettings">설정</button>
      </div>
    </div>

    <div id="pwStep" style="display:none">
      <h2>비밀번호 확인</h2>
      <input type="password" id="pwInput" inputmode="numeric" placeholder="비밀번호를 입력하세요" autocomplete="off">
      <div class="modal-msg" id="pwMsg"></div>
      <div class="modal-actions">
        <button type="button" class="cancel" id="pwCancel">취소</button>
        <button type="button" class="ok" id="pwOk">확인</button>
      </div>
    </div>

    <div id="infoStep" style="display:none">
      <h2>정보 수정</h2>
      <textarea id="infoText" placeholder="이 영상에 대한 정보를 입력하세요"></textarea>
      <div class="modal-msg" id="infoMsg"></div>
      <div class="modal-actions">
        <button type="button" class="cancel" id="infoCancel">취소</button>
        <button type="button" class="ok" id="infoSave">저장</button>
      </div>
    </div>

  </div>
</div>

<script src="js/app.js"></script>
<script>
const grid  = document.getElementById("grid");
const empty = document.getElementById("empty");
const addBtn = document.getElementById("addBtn");
const selectBar = document.getElementById("selectBar");
const btnSelectMode = document.getElementById("btnSelectMode");

let currentVideoId = null;
let videoList = [];       // 현재 표시 중인 영상 목록
let selecting = false;    // 선택 모드 여부
let picked = new Set();   // 선택된 영상 id

function thumbOf(id){ return "https://img.youtube.com/vi/" + id + "/hqdefault.jpg"; }

function renderGrid(){
  grid.className = "vgrid" + (selecting ? " selecting" : "");
  grid.innerHTML = videoList.map(v => {
    const isPicked = picked.has(v.id);
    return `<div class="vcard${isPicked ? " picked" : ""}" data-id="${escapeHtml(v.id)}">
              <img src="${thumbOf(v.id)}" loading="lazy" alt="유튜브 영상">
              <div class="playmark"><span>▶</span></div>
              <div class="dim"></div>
              <div class="check">${isPicked ? "✓" : ""}</div>
            </div>`;
  }).join("");
  Array.from(grid.querySelectorAll(".vcard")).forEach(el => {
    el.addEventListener("click", () => {
      const id = el.getAttribute("data-id");
      if (selecting){
        if (picked.has(id)) picked.delete(id); else picked.add(id);
        renderGrid();
      } else {
        openPlayer(id);
      }
    });
  });
}

async function load(){
  try{
    const videos = await fetchJSON("api/video_list.php");
    videoList = videos;
    picked = new Set(Array.from(picked).filter(id => videoList.some(v => v.id === id)));
    if(videos.length === 0){
      empty.style.display = "block";
      grid.innerHTML = "";
      addBtn.style.display = "flex";
      btnSelectMode.style.display = "none";
      selectBar.style.display = "none";
      return;
    }
    empty.style.display = "none";
    btnSelectMode.style.display = "inline-block";
    renderGrid();
  }catch(e){
    empty.style.display = "block";
    empty.innerHTML = `<div class="big">⚠️</div>목록을 불러오지 못했어요.<br><span style="font-size:12px">(api/video_list.php가 PHP로 실행되는 서버가 필요해요)</span>`;
  }
}

/* ---- 선택 모드 / 삭제 ---- */
function setSelecting(on){
  selecting = on;
  if (!selecting) picked.clear();
  btnSelectMode.textContent = selecting ? "취소" : "삭제";
  btnSelectMode.classList.toggle("on", selecting);
  addBtn.style.display = selecting ? "none" : "flex";
  selectBar.style.display = selecting ? "flex" : "none";
  renderGrid();
}
btnSelectMode.addEventListener("click", () => setSelecting(!selecting));

document.getElementById("btnDeleteSel").addEventListener("click", () => {
  if (picked.size === 0){
    alert("삭제할 영상을 먼저 선택해주세요.");
    return;
  }
  openDelPwModal();
});

async function performDelete(){
  const list = Array.from(picked);

  const succeeded = [];
  for (const id of list){
    try{
      const body = new URLSearchParams();
      body.set("id", id);
      const res = await fetch("api/video_delete.php", { method: "POST", body });
      const data = await res.json();
      if (res.ok && !data.error) succeeded.push(id);
    }catch(e){}
  }

  videoList = videoList.filter(v => !succeeded.includes(v.id));
  picked.clear();
  setSelecting(false);
  if(videoList.length === 0){
    empty.style.display = "block";
    grid.innerHTML = "";
    addBtn.style.display = "flex";
    btnSelectMode.style.display = "none";
  }

  if (succeeded.length < list.length){
    alert(succeeded.length + "개 삭제, " + (list.length - succeeded.length) + "개는 삭제하지 못했어요.");
  }
}

/* ---- 삭제 비밀번호 확인: 기기 키보드 대신 터치 키패드 ---- */
const delPwModal = document.getElementById("delPwModal");
const delPwDesc  = document.getElementById("delPwDesc");
const delPwDots  = document.getElementById("delPwDots");
const delPwMsg   = document.getElementById("delPwMsg");
const delKeypad  = document.getElementById("delKeypad");
const DELETE_PASSWORD = "3553";
let delPwEntered = "";

function renderDelPwDots(){
  Array.from(delPwDots.querySelectorAll(".dot")).forEach((dot, i) => {
    dot.classList.toggle("filled", i < delPwEntered.length);
  });
}

function openDelPwModal(){
  delPwEntered = "";
  delPwMsg.textContent = "";
  delPwDesc.textContent = picked.size + "개의 영상을 삭제하려면 비밀번호를 입력하세요.";
  renderDelPwDots();
  delPwModal.classList.add("open");
}
function closeDelPwModal(){
  delPwModal.classList.remove("open");
  delPwEntered = "";
}
document.getElementById("delPwCancel").addEventListener("click", closeDelPwModal);
delPwModal.addEventListener("click", (e) => { if (e.target === delPwModal) closeDelPwModal(); });

delKeypad.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-k]");
  if (!btn) return;
  const k = btn.getAttribute("data-k");

  if (k === "del"){
    delPwEntered = delPwEntered.slice(0, -1);
    renderDelPwDots();
    return;
  }
  if (delPwEntered.length >= 4) return;
  delPwEntered += k;
  renderDelPwDots();

  if (delPwEntered.length === 4){
    if (delPwEntered === DELETE_PASSWORD){
      delPwMsg.textContent = "";
      setTimeout(() => {
        closeDelPwModal();
        performDelete();
      }, 120);
    } else {
      delPwMsg.textContent = "비밀번호가 올바르지 않습니다.";
      delPwDots.classList.add("shake");
      setTimeout(() => {
        delPwDots.classList.remove("shake");
        delPwEntered = "";
        renderDelPwDots();
      }, 350);
    }
  }
});

/* ---- 웹플레이어 ---- */
const playerViewer = document.getElementById("playerViewer");
const playerWrap    = document.getElementById("playerWrap");
const playerFrame   = document.getElementById("playerFrame");
const playBar       = document.getElementById("playBar");
const fsExit        = document.getElementById("fsExit");

function openPlayer(id){
  currentVideoId = id;
  const iframe = document.createElement("iframe");
  iframe.src = `https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0`;
  iframe.title = "YouTube video player";
  iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
  iframe.allowFullscreen = true;
  playerFrame.innerHTML = "";
  playerFrame.appendChild(iframe);
  playerViewer.classList.add("open");
  playBar.style.display = "flex";
}
function closePlayer(){
  playerViewer.classList.remove("open");
  playBar.style.display = "none";
  playerFrame.innerHTML = "";
  currentVideoId = null;
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}
document.getElementById("playerClose").addEventListener("click", closePlayer);
playerViewer.addEventListener("click", (e) => { if (e.target === playerViewer) closePlayer(); });

/* ---- 전체화면 + 자동 가로회전 ----
   가능하면 화면 방향 잠금(API)으로 실제 기기를 가로로 돌려 고정하고,
   브라우저가 이를 지원/허용하지 않으면 세로 상태에서도 영상 영역을
   CSS로 90도 회전시켜 가로처럼 보이게 자동 전환합니다. */
document.getElementById("btnFullscreen").addEventListener("click", async () => {
  try{
    await playerWrap.requestFullscreen();
  }catch(e){
    alert("이 브라우저에서는 전체화면이 지원되지 않아요.");
    return;
  }
  let locked = false;
  if (screen.orientation && screen.orientation.lock){
    try{
      await screen.orientation.lock("landscape");
      locked = true;
    }catch(e){ locked = false; }
  }
  if (!locked){
    playerWrap.classList.add("force-landscape");
  }
});
fsExit.addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
});
document.addEventListener("fullscreenchange", () => {
  const isFs = document.fullscreenElement === playerWrap;
  fsExit.classList.toggle("show", isFs);
  if (!isFs){
    playerWrap.classList.remove("force-landscape");
    if (screen.orientation && screen.orientation.unlock){
      try{ screen.orientation.unlock(); }catch(e){}
    }
  }
});

/* ---- 링크 추가: 비밀번호 확인 후 업로드 ---- */
const addModal   = document.getElementById("addModal");
const addPwStep   = document.getElementById("addPwStep");
const addLinkStep = document.getElementById("addLinkStep");
const addPwInput  = document.getElementById("addPwInput");
const addPwMsg    = document.getElementById("addPwMsg");
const ytLink      = document.getElementById("ytLink");
const addMsg      = document.getElementById("addMsg");

let addPassword = "";

function showAddStep(step){
  addPwStep.style.display   = (step === "pw")   ? "block" : "none";
  addLinkStep.style.display = (step === "link") ? "block" : "none";
}
function openAddModal(){
  addPassword = "";
  addPwInput.value = "";
  addPwMsg.textContent = "";
  ytLink.value = "";
  addMsg.textContent = "";
  showAddStep("pw");
  addModal.classList.add("open");
  setTimeout(() => addPwInput.focus(), 50);
}
function closeAddModal(){
  addModal.classList.remove("open");
}
document.getElementById("addBtn").addEventListener("click", openAddModal);
document.getElementById("addPwCancel").addEventListener("click", closeAddModal);
document.getElementById("addCancel").addEventListener("click", closeAddModal);
addModal.addEventListener("click", (e) => { if (e.target === addModal) closeAddModal(); });

document.getElementById("addPwOk").addEventListener("click", () => {
  if (addPwInput.value !== "3553"){
    addPwMsg.textContent = "비밀번호가 올바르지 않습니다.";
    return;
  }
  addPassword = addPwInput.value;
  addPwMsg.textContent = "";
  showAddStep("link");
  setTimeout(() => ytLink.focus(), 50);
});
addPwInput.addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("addPwOk").click(); });

document.getElementById("addOk").addEventListener("click", async () => {
  const link = ytLink.value.trim();
  if (link === ""){
    addMsg.textContent = "링크를 입력해주세요.";
    return;
  }
  addMsg.textContent = "업로드하는 중...";
  try{
    const body = new URLSearchParams();
    body.set("link", link);
    body.set("password", addPassword);
    const res = await fetch("api/video_add.php", { method: "POST", body });
    const data = await res.json();
    if (!res.ok || data.error){
      addMsg.textContent = data.error || "올바른 유튜브 링크가 아니에요.";
      return;
    }
    addMsg.textContent = "";
    closeAddModal();
    load();
  }catch(e){
    addMsg.textContent = "업로드하지 못했어요. 서버 연결을 확인해주세요.";
  }
});
ytLink.addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("addOk").click(); });

/* ---- 정보 보기 / 비밀번호 확인 후 수정 ---- */
const infoModal = document.getElementById("infoModal");
const viewStep   = document.getElementById("viewStep");
const infoView   = document.getElementById("infoView");
const pwStep     = document.getElementById("pwStep");
const infoStep   = document.getElementById("infoStep");
const pwInput    = document.getElementById("pwInput");
const pwMsg      = document.getElementById("pwMsg");
const infoText   = document.getElementById("infoText");
const infoMsg    = document.getElementById("infoMsg");

let currentInfo = "";

function showStep(step){
  viewStep.style.display = (step === "view") ? "block" : "none";
  pwStep.style.display   = (step === "pw")   ? "block" : "none";
  infoStep.style.display = (step === "edit") ? "block" : "none";
}

async function openInfoModal(){
  if (!currentVideoId) return;
  infoModal.classList.add("open");
  showStep("view");
  infoView.textContent = "불러오는 중...";
  try{
    const data = await fetchJSON("api/video_info.php?id=" + encodeURIComponent(currentVideoId));
    currentInfo = data.info || "";
    infoView.textContent = currentInfo.trim() !== "" ? currentInfo : "등록된 정보가 없습니다.";
  }catch(e){
    currentInfo = "";
    infoView.textContent = "정보를 불러오지 못했어요.";
  }
}
function closeInfoModal(){
  infoModal.classList.remove("open");
}
document.getElementById("btnInfo").addEventListener("click", openInfoModal);
document.getElementById("viewClose").addEventListener("click", closeInfoModal);
infoModal.addEventListener("click", (e) => { if (e.target === infoModal) closeInfoModal(); });

document.getElementById("viewSettings").addEventListener("click", () => {
  pwInput.value = "";
  pwMsg.textContent = "";
  showStep("pw");
  setTimeout(() => pwInput.focus(), 50);
});
document.getElementById("pwCancel").addEventListener("click", () => showStep("view"));
document.getElementById("infoCancel").addEventListener("click", () => showStep("view"));

document.getElementById("pwOk").addEventListener("click", () => {
  if (pwInput.value !== "3553"){
    pwMsg.textContent = "비밀번호가 올바르지 않습니다.";
    return;
  }
  pwMsg.textContent = "";
  infoMsg.textContent = "";
  infoText.value = currentInfo;
  showStep("edit");
});
pwInput.addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("pwOk").click(); });

document.getElementById("infoSave").addEventListener("click", async () => {
  infoMsg.textContent = "저장 중...";
  try{
    const body = new URLSearchParams();
    body.set("id", currentVideoId);
    body.set("password", "3553");
    body.set("info", infoText.value);
    const res = await fetch("api/video_info.php", { method: "POST", body });
    if (!res.ok) throw new Error("save failed");
    currentInfo = infoText.value;
    infoView.textContent = currentInfo.trim() !== "" ? currentInfo : "등록된 정보가 없습니다.";
    infoMsg.textContent = "";
    showStep("view");
  }catch(e){
    infoMsg.textContent = "저장하지 못했어요. 서버 연결을 확인해주세요.";
  }
});

load();
</script>
</body>
</html>
